# Publish @jummon/auth to public npm — TRUSTED PUBLISHING (OIDC, tokenless).
#
# No long-lived npm token. The workflow's OIDC id-token authenticates directly to
# npm as a verified CI publisher (exempt from per-publish 2FA/OTP), and provenance
# is attached automatically. This is npm's recommended path (token publish is
# deprecated, ends Jan 2027) and removes the NPM_TOKEN secret entirely.
#
# GATE: runs ONLY when a human cuts a GitHub Release. The Release is the approval.
#
# ONE-TIME npm-side setup (founder-gated) — configure the Trusted Publisher on the
# package so npm trusts this exact workflow:
#   npmjs.com → @jummon/auth → Settings → "Trusted Publisher" → GitHub Actions →
#     Organization/owner: jummon-one
#     Repository:         jummon-auth-sdk
#     Workflow filename:  publish.yml
#     Environment:        (leave blank)
#   Until this is configured, publish will fail with an auth error — that is expected.
name: Publish @jummon/auth

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # OIDC → npm trusted-publisher auth + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: deliberately NO `registry-url` — that writes an .npmrc with an empty
      # `_authToken` (we have no NPM_TOKEN), which forces token-auth mode and BLOCKS
      # OIDC trusted publishing (npm returns E404 on PUT). Without it, npm@11 detects
      # the OIDC id-token and authenticates via the configured Trusted Publisher.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upgrade npm to 11.x (OIDC trusted publishing needs >= 11.5.1; npm 12 requires Node 22+, runner is Node 20)
        run: npm install -g npm@11

      - name: Install (clean, lockfile-pinned)
        run: npm ci

      - name: Typecheck + build (must be green before publish)
        run: |
          npm run typecheck
          npm run build

      - name: Guard — release tag must match package version
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "release tag ($tag) != package.json version ($pkg) — bump package.json first"; exit 1
          fi
          echo "publishing @jummon/auth@$pkg"

      - name: Diagnose OIDC availability (temporary)
        run: |
          echo "npm: $(npm --version)  node: $(node --version)"
          echo "OIDC id-token endpoint present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+YES}"
          echo "repo: ${GITHUB_REPOSITORY}  ref: ${GITHUB_REF}  workflow file: ${GITHUB_WORKFLOW_REF}"

      - name: Publish to npm (trusted publishing + provenance)
        run: npm publish --provenance --access public --loglevel verbose
        # No NODE_AUTH_TOKEN — auth comes from the OIDC id-token via the configured
        # Trusted Publisher. The verbose log surfaces the exact OIDC exchange result
        # (temporary — trim once tokenless publishing is confirmed working).
